<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08090a" />
  <meta name="robots" content="noindex" />
  <title>Jarwiz — The AI workspace for thinking and building</title>
  <meta name="description" content="Turn your files and questions into documents, diagrams and working prototypes you can keep shaping." />
  <link rel="preload" href="%BASE_URL%work/jarwiz-launch-v1/fonts/InterVariable-v4.1.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/src/jarwiz-stage-1.css" />
</head>
<body>
  <a class="skip-link" href="#overview">Skip to content</a>
  <header class="site-header">
    <div class="nav-inner">
      <a class="wordmark" href="#overview" aria-label="Jarwiz, overview">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1C17.8 11.4 20.6 14.2 31 16 20.6 17.8 17.8 20.6 16 31 14.2 20.6 11.4 17.8 1 16 11.4 14.2 14.2 11.4 16 1Z" fill="currentColor" /></svg>
        <span>Jarwiz</span>
      </a>
      <a class="try-link" href="https://raagulmanoharan.github.io/Jarwiz-V3/" target="_blank" rel="noopener">Try Jarwiz <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main id="overview">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">The AI workspace for thinking and building with your context.</h1>
        <p>Turn your files and questions into documents, diagrams and working prototypes you can keep shaping.</p>
      </div>
      <figure class="product-scene" aria-label="Native Jarwiz documents, tables, diagrams and prompt composer">
        <picture class="canvas-plate" aria-hidden="true">
          <source media="(max-width: 640px)" srcset="%BASE_URL%work/jarwiz-direction-v2/components/canvas-mobile.webp" width="716" height="920" />
          <img src="%BASE_URL%work/jarwiz-direction-v2/components/canvas-desktop.webp" width="2640" height="1280" alt="" decoding="async" />
        </picture>
        <div class="scene-background">
          <div class="native-fragment research-fragment">
            <picture>
              <source media="(max-width: 640px)" srcset="%BASE_URL%work/jarwiz-direction-v2/components/research-mobile.webp" width="716" height="697" />
              <img src="%BASE_URL%work/jarwiz-direction-v2/components/research-desktop.webp" width="1274" height="1217" alt="A native Jarwiz research document with a highlighted finding and detailed supporting context." fetchpriority="high" decoding="async" />
            </picture>
          </div>
          <div class="native-fragment opportunity-fragment">
            <img src="%BASE_URL%work/jarwiz-direction-v2/components/opportunity.webp" width="1274" height="910" alt="A native opportunity table connects findings with ideas to explore." decoding="async" />
          </div>
          <div class="native-fragment blueprint-fragment">
            <img src="%BASE_URL%work/jarwiz-direction-v2/components/blueprint.webp" width="1274" height="1256" alt="A native service blueprint maps the steps and recovery paths of an experience." decoding="async" />
          </div>
        </div>
        <div class="native-fragment composer-fragment">
          <picture>
            <source media="(max-width: 640px)" srcset="%BASE_URL%work/jarwiz-direction-v2/components/composer-mobile.webp" width="716" height="364" />
            <img src="%BASE_URL%work/jarwiz-direction-v2/components/composer-desktop.webp" width="1312" height="364" alt="The native Jarwiz composer, ready for the next question." fetchpriority="high" decoding="async" />
          </picture>
        </div>
      </figure>
    </section>
  </main>
</body>
</html>
