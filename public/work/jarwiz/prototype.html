<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#25271f;font:14px system-ui;padding:32px}small{color:#8c8f80}h1{font-size:26px;font-weight:500;margin:10px 0 32px}.time{font-size:72px;letter-spacing:-5px;text-align:center;font-weight:400;padding:20px}.buttons{display:flex;gap:10px;justify-content:center;margin:24px 0}button{padding:12px 28px;border:1px solid #d8dbd0;background:white;border-radius:30px;color:#3b4330;cursor:pointer}button:first-child{background:#dce5c9;border-color:#dce5c9}.label{text-align:center;font-size:12px;color:#969a89}</style></head><body><small>TEAM TRIAL / FOCUS TIMER</small><h1>Make room for deep work.</h1><div class="time" id="time">25:00</div><div class="label" id="state">One task. A little space to think.</div><div class="buttons"><button onclick="toggle()" id="toggle">Start focus</button><button onclick="reset()">Reset</button></div><script>let remaining=1500,running=false,interval;function paint(){document.getElementById('time').textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0')}function toggle(){running=!running;document.getElementById('toggle').textContent=running?'Pause':'Continue';document.getElementById('state').textContent=running?'You’re making progress.':'Take a breath.';if(running)interval=setInterval(()=>{remaining--;paint()},1000);else clearInterval(interval)}function reset(){clearInterval(interval);running=false;remaining=1500;paint();document.getElementById('toggle').textContent='Start focus';document.getElementById('state').textContent='One task. A little space to think.'}</script></body></html>
