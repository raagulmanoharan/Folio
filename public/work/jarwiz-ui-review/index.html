<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Jarwiz / UI review</title>
  <style>
    @font-face{font-family:Neue;src:url('../jarwiz-review/NeueMontreal-Regular.otf');font-weight:400;font-display:swap}
    @font-face{font-family:Neue;src:url('../jarwiz-review/NeueMontreal-Medium.otf');font-weight:500 700;font-display:swap}
    :root{color-scheme:light;--ink:#20241f;--muted:#7a8176;--line:#e8ebe4;--paper:#f5f6f2}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:var(--ink);font-family:Neue,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button,a{-webkit-tap-highlight-color:transparent}
    button{font:inherit;color:inherit;cursor:pointer}
    a{color:inherit;text-decoration:none}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid #607456;outline-offset:4px}
    main{width:min(100%,1280px);margin:auto;padding:52px 48px 32px}
    .intro{margin-bottom:32px}
    .brand{width:25px;height:25px;margin-bottom:24px;display:block}
    h1{font-size:38px;line-height:1.12;letter-spacing:-1.3px;font-weight:500;margin:0 0 13px}
    h1 span{color:#9a9e95;font-weight:400}
    .description{max-width:650px;margin:0;font-size:18px;line-height:1.5;color:var(--muted)}
    .surface-tabs{display:flex;gap:8px;overflow-x:auto;padding:5px 3px 12px;margin:0 -3px 8px;scrollbar-width:thin;scrollbar-color:#dce1d7 transparent}
    .surface-tab{display:flex;align-items:center;justify-content:flex-start;gap:10px;flex:1 0 auto;min-width:0;padding:8px;background:#fff;border:1px solid transparent;border-radius:10px;text-align:left;color:#8b9285;font-size:13px;line-height:1.2;white-space:nowrap}
    .surface-tab:hover{background:#f8f9f6;color:#424d39}
    .surface-tab[aria-selected="true"]{background:#f4f6f0;border-color:#e2e7dc;color:#273421}
    .tab-preview{display:block;flex:none;width:48px;height:32px;border:1px solid #e6e9e0;border-radius:4px;overflow:hidden;background:var(--paper)}
    .tab-preview img{display:block;width:100%;height:100%;object-fit:cover;opacity:.75}
    .surface-tab[aria-selected="true"] .tab-preview img{opacity:1}
    .surface-figure{margin:0}
    .surface-stage{position:relative;aspect-ratio:3/2;max-height:1000px;margin-inline:auto;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
    .surface-open{display:block;width:100%;height:100%;cursor:zoom-in}
    .surface-image{display:block;width:100%;height:100%;object-fit:contain}
    .surface-zoom{position:absolute;right:16px;bottom:16px;display:grid;place-items:center;width:36px;height:36px;border:1px solid #e4e8de;border-radius:50%;background:#fffffff2;color:#637258;box-shadow:0 2px 10px #26302108;pointer-events:none}
    .surface-zoom svg{width:16px;height:16px}
    .surface-empty{position:absolute;inset:0;display:grid;place-items:center;padding:28px;text-align:center;color:#89937f;font-size:14px;line-height:1.5}
    .surface-empty[hidden]{display:none}
    .surface-caption{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-top:16px;font-size:14px;line-height:1.5;color:var(--muted)}
    .surface-caption p{margin:0}
    .surface-caption strong{font-weight:500;color:#35412e;margin-right:9px}
    .surface-full{white-space:nowrap;flex:none;color:#66765b;font-size:12px;padding-top:2px}
    .surface-full:hover{color:#24361a}
    .footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px 24px;margin-top:40px;padding-top:19px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:#91988b}
    .footer p{margin:0}
    .surface-lightbox{border:1px solid #e0e5dc;border-radius:15px;padding:0;width:min(1568px,calc(100vw - 40px));max-width:none;max-height:calc(100dvh - 40px);background:#fff;box-shadow:0 28px 100px #0003;overflow:hidden}
    .surface-lightbox::backdrop{background:#192016a3;backdrop-filter:blur(6px)}
    .lightbox-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 18px;border-bottom:1px solid var(--line)}
    .lightbox-head h2{margin:0;font-size:14px;line-height:1.3;letter-spacing:0;font-weight:500}
    .lightbox-actions{display:flex;align-items:center;gap:8px}
    .lightbox-button{height:32px;min-width:32px;padding:0 10px;display:grid;place-items:center;background:#fff;border:1px solid #e2e7dc;border-radius:7px;color:#65745b;font-size:12px}
    .lightbox-button:hover{background:#f4f6f0}
    .lightbox-button svg{width:15px;height:15px}
    .lightbox-scroll{max-height:calc(100dvh - 104px);overflow:auto;overscroll-behavior:contain;background:#f5f6f2}
    .lightbox-image{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100dvh - 104px);object-fit:contain;margin:auto}
    .surface-lightbox[data-actual-size="true"] .lightbox-image{max-width:none;max-height:none;margin:0}
    @media(max-width:900px){main{padding:38px 28px 28px}.surface-tab{flex:none;min-width:145px}.surface-tabs{margin-bottom:7px}.intro{margin-bottom:24px}}
    @media(max-width:540px){main{padding:30px 18px 24px}.brand{width:23px;height:23px;margin-bottom:22px}h1{font-size:32px;letter-spacing:-1px}.description{font-size:16px;line-height:1.5}.intro{margin-bottom:23px}.surface-tab{min-width:134px;gap:9px;padding:7px;font-size:12px}.tab-preview{width:42px;height:28px}.surface-stage{border-radius:11px}.surface-caption{flex-wrap:wrap;gap:10px;margin-top:13px;font-size:13px}.surface-full{font-size:12px}.surface-zoom{right:11px;bottom:11px;width:31px;height:31px}.footer{margin-top:30px;gap:6px;padding-top:17px;font-size:11px}.surface-lightbox{width:calc(100vw - 18px);max-height:calc(100dvh - 20px);border-radius:11px}.lightbox-head{padding:11px 12px}.lightbox-head h2{font-size:13px}.lightbox-button{height:30px;min-width:30px;font-size:11px}.lightbox-scroll,.lightbox-image{max-height:calc(100dvh - 74px)}}
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <svg class="brand" viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 1C14.6 11.3 11.3 14.6 1 16c10.3 1.4 13.6 4.7 15 15 1.4-10.3 4.7-13.6 15-15C20.7 14.6 17.4 11.3 16 1Z"/></svg>
      <h1>Jarwiz <span>/ UI review</span></h1>
      <p class="description">Compact attachments, clearer type, and sources inside the cards. Nine surfaces, ready for a closer look.</p>
    </header>
    <section aria-label="Product screenshots">
      <div class="surface-tabs" role="tablist" aria-label="Product surface">
        <button type="button" class="surface-tab" id="tab-start" role="tab" aria-selected="true" aria-controls="surface-panel" tabindex="0" data-surface="start"><span class="tab-preview"><img src="./surfaces/start.png?v=composer-mode" alt="" loading="lazy"></span><span>Start</span></button>
        <button type="button" class="surface-tab" id="tab-attachments" role="tab" aria-selected="false" aria-controls="surface-panel" tabindex="-1" data-surface="attachments"><span class="tab-preview"><img src="./surfaces/attachments.png?v=composer-mode" alt="" loading="lazy"></span><span>Attachments</span></button>
        <button type="button" class="surface-tab" id="tab-format" role="tab" aria-selected="false" aria-controls="surface-panel" tabindex="-1" data-surface="format"><span class="tab-preview"><img src="./surfaces/format.png?v=composer-mode" alt="" loading="lazy"></span><span>Response format</span></button>
        <button type="button" class="surface-tab" id="tab-research" role="tab" aria-selected="false" aria-controls="surface-panel" tabindex="-1" data-surface="research"><span class="tab-preview"><img src="./surfaces/research.png?v=composer-mode" alt="" loading="lazy"></span><span>Research</span></button>
        <button type="button" class="surface-tab" id="tab-opportunities" role="tab" aria-selected="false" aria-controls="surface-panel" tabindex="-1" data-surface="opportunities"><span class="tab-preview"><img src="./surfaces/opportunities.png?v=composer-mode" alt="" loading="lazy"></span><span>Opportunities</span></button>
        <button type="button" class="surface-tab" id="tab-evidence" role="tab" aria-selected="false" aria-controls="surface-panel" tabindex="-1" data-surface="evidence"><span class="tab-preview"><img src="./surfaces/evidence.png?v=composer-mode" alt="" loading="lazy"></span><span>Evidence</span></button>
        <button type="button" class="surface-tab" id="tab-comparison" role="tab" aria-selected="false" aria-controls="surface-panel" tabindex="-1" data-surface="comparison"><span class="tab-preview"><img src="./surfaces/comparison.png?v=composer-mode" alt="" loading="lazy"></span><span>Comparison</span></button>
        <button type="button" class="surface-tab" id="tab-blueprint" role="tab" aria-selected="false" aria-controls="surface-panel" tabindex="-1" data-surface="blueprint"><span class="tab-preview"><img src="./surfaces/blueprint.png?v=composer-mode" alt="" loading="lazy"></span><span>Blueprint</span></button>
        <button type="button" class="surface-tab" id="tab-canvas" role="tab" aria-selected="false" aria-controls="surface-panel" tabindex="-1" data-surface="canvas"><span class="tab-preview"><img src="./surfaces/canvas.png?v=composer-mode" alt="" loading="lazy"></span><span>Canvas</span></button>
      </div>
      <div id="surface-panel" role="tabpanel" aria-labelledby="tab-start" tabindex="0">
        <figure class="surface-figure">
          <div class="surface-stage">
            <a class="surface-open" id="surface-open" href="./surfaces/start.png?v=composer-mode" target="_blank" rel="noopener" aria-label="Inspect the Start screen">
              <img class="surface-image" id="surface-image" src="./surfaces/start.png?v=composer-mode" width="1440" height="960" alt="Jarwiz’s starting prompt" fetchpriority="high">
              <span class="surface-zoom" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            </a>
            <p class="surface-empty" id="surface-empty" hidden>This screenshot is being prepared.</p>
          </div>
          <figcaption class="surface-caption"><p><strong id="surface-label">Start</strong><span id="surface-caption">Begin with the question.</span></p><a class="surface-full" id="surface-full" href="./surfaces/start.png?v=composer-mode" target="_blank" rel="noopener">Open full image ↗</a></figcaption>
        </figure>
      </div>
    </section>
    <footer class="footer"><p>Actual Jarwiz components · Prepared sample content</p><p>Select a surface. Click the image to inspect.</p></footer>
  </main>
  <dialog class="surface-lightbox" id="surface-lightbox" aria-labelledby="lightbox-title" data-actual-size="false">
    <header class="lightbox-head"><h2 id="lightbox-title">Start</h2><div class="lightbox-actions"><button type="button" class="lightbox-button" id="lightbox-size" aria-pressed="false">Actual size</button><button type="button" class="lightbox-button" id="lightbox-close" aria-label="Close screenshot"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m5 5 10 10M15 5 5 15" stroke-linecap="round"/></svg></button></div></header>
    <div class="lightbox-scroll"><img class="lightbox-image" id="lightbox-image" alt=""></div>
  </dialog>
  <script>
    const surfaces={
      start:{label:'Start',caption:'Begin with the question.',alt:'Jarwiz’s starting prompt'},
      attachments:{label:'Attachments',caption:'Keep the supporting files close to the question.',alt:'Compact report attachments in the Jarwiz prompt'},
      format:{label:'Response format',caption:'Let Jarwiz choose, or choose a response format.',alt:'Jarwiz response format menu with Auto and specific output choices'},
      research:{label:'Research',caption:'Read the reasoning and follow its sources.',alt:'A Jarwiz research card with sources inside the card'},
      opportunities:{label:'Opportunities',caption:'Explore the opportunities before choosing a solution.',alt:'An opportunity table on the Jarwiz canvas'},
      evidence:{label:'Evidence',caption:'Separate what the reports show from what still needs testing.',alt:'Evidence and assumptions from the supplied reports'},
      comparison:{label:'Comparison',caption:'Compare the approaches side by side.',alt:'A detailed comparison table in Jarwiz'},
      blueprint:{label:'Blueprint',caption:'Follow each step across service lanes, with recovery paths where needed.',alt:'A chronological service blueprint with conditional recovery paths on the Jarwiz canvas'},
      canvas:{label:'Canvas',caption:'Keep the whole response in view.',alt:'The complete Jarwiz working canvas'},
    };
    const tabs=[...document.querySelectorAll('[data-surface]')];
    const panel=document.querySelector('#surface-panel'),stage=document.querySelector('.surface-stage'),mainImage=document.querySelector('#surface-image'),imageLink=document.querySelector('#surface-open'),fullLink=document.querySelector('#surface-full'),empty=document.querySelector('#surface-empty');
    const dialog=document.querySelector('#surface-lightbox'),dialogImage=document.querySelector('#lightbox-image'),sizeButton=document.querySelector('#lightbox-size');
    let selected='start',previousOverflow='';
    const path=key=>`./surfaces/${key}.png?v=composer-mode`;
    function setImageState(ready){empty.hidden=ready;imageLink.style.visibility=ready?'visible':'hidden';fullLink.hidden=!ready;if(ready&&mainImage.naturalWidth){stage.style.aspectRatio=`${mainImage.naturalWidth} / ${mainImage.naturalHeight}`;}}
    function selectSurface(key,focus=false,updateHash=true){
      if(!Object.hasOwn(surfaces,key))return;
      selected=key;
      const surface=surfaces[key];
      tabs.forEach(tab=>{const active=tab.dataset.surface===key;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1;});
      panel.setAttribute('aria-labelledby',`tab-${key}`);
      mainImage.src=path(key);mainImage.alt=surface.alt;
      imageLink.href=path(key);fullLink.href=path(key);imageLink.setAttribute('aria-label',`Inspect the ${surface.label} screen`);
      document.querySelector('#surface-label').textContent=surface.label;document.querySelector('#surface-caption').textContent=surface.caption;
      empty.textContent=`The ${surface.label.toLowerCase()} screenshot is being prepared.`;
      setImageState(true);
      const tab=document.querySelector(`#tab-${key}`);
      if(focus)tab.focus({preventScroll:true});
      tab.scrollIntoView({block:'nearest',inline:'nearest'});
      if(updateHash&&location.hash!==`#${key}`)history.replaceState(history.state,'',`#${key}`);
    }
    tabs.forEach((tab,index)=>{
      tab.addEventListener('click',()=>selectSurface(tab.dataset.surface));
      tab.addEventListener('keydown',event=>{
        let next=index;
        if(event.key==='ArrowRight')next=(index+1)%tabs.length;
        else if(event.key==='ArrowLeft')next=(index-1+tabs.length)%tabs.length;
        else if(event.key==='Home')next=0;
        else if(event.key==='End')next=tabs.length-1;
        else return;
        event.preventDefault();selectSurface(tabs[next].dataset.surface,true);
      });
    });
    document.querySelectorAll('.tab-preview img').forEach(img=>{img.addEventListener('error',()=>{img.style.visibility='hidden';});if(img.complete&&!img.naturalWidth)img.style.visibility='hidden';});
    mainImage.addEventListener('load',()=>setImageState(true));
    mainImage.addEventListener('error',()=>setImageState(false));
    if(mainImage.complete)setImageState(mainImage.naturalWidth>0);
    function resetZoom(){dialog.dataset.actualSize='false';dialogImage.style.width='';sizeButton.textContent='Actual size';sizeButton.setAttribute('aria-pressed','false');}
    imageLink.addEventListener('click',event=>{
      if(event.metaKey||event.ctrlKey||event.shiftKey||event.altKey||typeof dialog.showModal!=='function')return;
      event.preventDefault();dialogImage.src=mainImage.src;dialogImage.alt=mainImage.alt;document.querySelector('#lightbox-title').textContent=surfaces[selected].label;
      resetZoom();previousOverflow=document.body.style.overflow;document.body.style.overflow='hidden';dialog.showModal();
      dialog.querySelector('.lightbox-scroll').scrollTo(0,0);
    });
    document.querySelector('#lightbox-close').addEventListener('click',()=>dialog.close());
    dialog.addEventListener('close',()=>{document.body.style.overflow=previousOverflow;});
    dialog.addEventListener('click',event=>{const rect=dialog.getBoundingClientRect();if(event.target===dialog&&(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom))dialog.close();});
    sizeButton.addEventListener('click',()=>{
      const actual=dialog.dataset.actualSize!=='true';dialog.dataset.actualSize=String(actual);dialogImage.style.width=actual?`${dialogImage.naturalWidth||mainImage.naturalWidth}px`:'';sizeButton.textContent=actual?'Fit to view':'Actual size';sizeButton.setAttribute('aria-pressed',String(actual));
    });
    function selectFromHash(){const key=location.hash.slice(1)||'start';if(Object.hasOwn(surfaces,key))selectSurface(key,false,false);}
    window.addEventListener('hashchange',selectFromHash);
    selectFromHash();
  </script>
</body>
</html>
