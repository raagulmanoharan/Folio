<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daymark — first useful plan</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202936;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #aac3f1;outline-offset:3px}button{border:0}.app{max-width:760px;min-height:100vh;margin:auto;background:#fff}.bar{height:53px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0f4}.brand{font-weight:650;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}.brand-mark{display:grid;place-items:center;background:#3762cd;color:white;width:23px;height:23px;border-radius:7px;font-size:16px}.bar-detail{font-size:10px;color:#98a1af}.page{padding:23px 26px 22px;animation:arrive .2s ease}.eyebrow{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#8593a8;font-weight:650}.page h1{font-size:29px;letter-spacing:-1.1px;line-height:1.12;font-weight:550;margin:9px 0 12px}.description{font-size:12px;color:#8a94a4;line-height:1.55;max-width:390px;margin:0 0 20px}.choices{display:grid;gap:10px}.choice{display:flex;text-align:left;align-items:center;gap:14px;background:white;border:1px solid #e1e7f0;border-radius:11px;padding:15px;color:#354153;width:100%;transition:background .18s,border-color .18s}.choice:hover{background:#f7f9ff;border-color:#b9caec}.choice-icon{height:35px;width:35px;border-radius:9px;background:#edf2fe;color:#5c7ccc;display:grid;place-items:center;font-size:20px;flex-shrink:0}.choice strong{display:block;font-size:16px;font-weight:550;letter-spacing:-.3px}.choice small{display:block;color:#94a0b0;font-size:10px;margin-top:3px}.choice-arrow{margin-left:auto;color:#a9b8d1}.subnote{margin-top:17px;display:flex;align-items:center;gap:6px;color:#9aa4b2;font-size:10px}.subnote i{height:5px;width:5px;border-radius:50%;background:#92b39d}.primary{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#3d67cf;color:white;border-radius:8px;font-size:13px;margin-top:16px}.primary:hover{background:#315bc1}.secondary{background:none;color:#9aa4b3;padding:10px 0;font-size:11px}.plan-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.plan-title{font-size:19px;font-weight:550;letter-spacing:-.6px}.badge{font-size:9px;letter-spacing:.03em;color:#7a91bc;padding:4px 7px;border-radius:6px;background:#eef3fc;white-space:nowrap}.badge-live{color:#658d78;background:#eef5f0}.tasks{background:#fff;border:1px solid #e4e9f0;border-radius:10px;overflow:hidden}.task{display:flex;align-items:center;gap:11px;min-height:46px;padding:11px 12px}.task+.task{border-top:1px solid #edf0f5}.task input[type=checkbox]{accent-color:#6c8bd1;height:14px;width:14px;margin:0;flex-shrink:0}.task-text{font-size:13px;flex:1;min-width:0}.task-title-input{border:0;background:none;outline:none;padding:0;width:100%;color:#465368;font-size:13px}.task-meta{font-size:9px;color:#a4adba;white-space:nowrap}.task-done .task-title-input,.task-done .task-text{text-decoration:line-through;color:#a6b0be}.preview-note{font-size:10px;color:#98a3b5;margin:12px 0}.saved{font-size:10px;min-height:15px;color:#7b9c85;margin-top:9px}.notes{width:100%;min-height:130px;border:1px solid #dce4ef;border-radius:9px;resize:vertical;outline-offset:3px;padding:13px;color:#4c5b70;font-size:13px;line-height:1.9;background:#fcfdff}.notes::placeholder{color:#b0bac9}.field-label{display:block;font-size:10px;color:#8796ac;margin-bottom:7px}.people{display:flex;align-items:center;gap:6px;font-size:10px;color:#9ba6b5;margin:8px 0 14px}.avatar{height:19px;width:19px;border-radius:50%;background:#e7eaf3;display:grid;place-items:center;color:#7c89a2;font-size:8px}.activity{padding:12px;border:1px solid #e4e9f0;border-radius:9px;margin-top:12px;background:#fafbfd}.activity-head{display:flex;align-items:center;gap:7px;font-size:10px;color:#8794a9}.activity p{margin:9px 0 0;font-size:12px;color:#536177}.update-form{margin-top:15px}.update-input{width:100%;padding:11px 12px;border:1px solid #dce4ef;border-radius:8px;outline-offset:3px;font-size:12px;color:#536177}.empty-note{font-size:11px;color:#a3acba}.screen-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.screen-heading .secondary{padding-top:3px}.back{background:none;color:#97a3b5;font-size:10px;padding:0 0 15px}.reset{font-size:10px;color:#a2acba;background:none}.end-actions{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.minimal{font-size:10px;color:#94a2b6} @keyframes arrive{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}@media(max-width:380px){.page{padding:20px}.bar{padding:0 20px}.page h1{font-size:26px}.choice{padding:12px}.choice strong{font-size:15px}}@media(prefers-reduced-motion:reduce){.page{animation:none}.choice{transition:none}}
</style></head><body><main class="app"><header class="bar"><span class="brand"><span class="brand-mark">d</span>Daymark</span><span class="bar-detail" data-header-detail>Your next useful step</span></header><div id="view"></div></main>
<script>window.__DAYMARK_CONFIG__={"version":"revised","entry":"creator"};

const config=Object.assign({version:'initial',entry:'creator'},window.__DAYMARK_CONFIG__||{});
const sample=['Book our train tickets','Choose somewhere to stay','Make a short packing list'];
const state={screen:'start',entry:config.entry,tasks:[...sample],checked:[],notes:'',adopted:false,update:'',updated:false};
const escape=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const taskRows=(editable=false)=>state.tasks.map((text,i)=>`<div class="task ${state.checked[i]?'task-done':''}"><input type="checkbox" aria-label="Complete ${escape(text)}" data-task-check="${i}" ${state.checked[i]?'checked':''} ${state.screen==='example'&&config.version!=='initial'?'disabled':''}>${editable?`<input class="task-title-input" data-task-edit="${i}" value="${escape(text)}" aria-label="Task ${i+1}">`:`<span class="task-text">${escape(text)}</span>`}<span class="task-meta">${i===0?'Today':'Soon'}</span></div>`).join('');
function render(){
 let html='';const view=document.querySelector('#view');view.dataset.screen=state.screen;
 if(state.screen==='setup')html=`<section class="page"><span class="eyebrow">Account created · workspace setup</span><h1>First, set up<br>your workspace.</h1><p class="description">A few details before your first plan.</p><label class="field-label" for="workspace">Workspace name</label><input id="workspace" class="update-input" placeholder="My workspace"><label class="field-label" style="margin-top:14px" for="purpose">What will you use it for?</label><input id="purpose" class="update-input" placeholder="Choose a purpose"><button class="primary" data-action="setupInvite">Continue <span>→</span></button><div class="subnote">Step 1 of 3 · Workspace / People / First plan</div></section>`;
 if(state.screen==='setupInvite')html=`<section class="page"><span class="eyebrow">Step 2 / People</span><h1>Who’s joining<br>your workspace?</h1><p class="description">Add people before you get started.</p><label class="field-label" for="people">Email addresses</label><textarea id="people" class="notes" placeholder="name@example.com"></textarea><button class="primary" data-action="setupBlank">Continue setup <span>→</span></button><button class="secondary" data-action="setupBlank">Do this later</button></section>`;
 if(state.screen==='setupBlank')html=`<section class="page"><span class="eyebrow">My workspace</span><h1>Your plans<br>will appear here.</h1><p class="description">Choose a template or create a plan to get started.</p><div class="card" style="border:1px dashed #dce4ef;border-radius:10px;padding:45px 20px;text-align:center;color:#aab4c3">No plans yet</div><button class="primary" data-action="start">Create a plan <span>＋</span></button></section>`;
 if(state.screen==='start')html=`<section class="page"><span class="eyebrow">A little less starting from scratch</span><h1>Make room for<br>what’s next.</h1><p class="description">An example to explore, or the notes you already have.<br>Start wherever you are.</p><div class="choices"><button class="choice" data-action="example"><span class="choice-icon">▤</span><span><strong>Explore an example</strong><small>See what a useful plan looks like</small></span><span class="choice-arrow">→</span></button><button class="choice" data-action="notes"><span class="choice-icon">≡</span><span><strong>Use my own notes</strong><small>Bring a plain-text list and make it yours</small></span><span class="choice-arrow">→</span></button></div><div class="subnote"><i></i>Something useful, before any invitations.</div></section>`;
 if(state.screen==='example')html=`<section class="page"><button class="back" data-action="start">← Your starting point</button><div class="plan-header"><span class="plan-title">Weekend away</span><span class="badge">${config.version==='initial'?'A starting point':'Example · preview only'}</span></div><p class="description">A few simple tasks. A clearer idea of the next step.</p><div class="tasks">${taskRows(config.version==='initial')}</div><p class="preview-note">${config.version==='initial'?'Explore this plan, then make it yours.':'This is an example. Your changes start after you use it.'}</p><button class="primary" data-action="adopt">Use this example <span>→</span></button></section>`;
 if(state.screen==='notes')html=`<section class="page"><button class="back" data-action="start">← Your starting point</button><span class="eyebrow">Bring what you have</span><h1>Your notes.<br>A little more shape.</h1><p class="description">Paste a plain-text list. You can review everything before creating a plan.</p><label class="field-label" for="notes">One task per line</label><textarea id="notes" class="notes" data-notes placeholder="Book train tickets&#10;Choose somewhere to stay&#10;Make a packing list">${escape(state.notes)}</textarea><button class="primary" data-action="review">Review my tasks <span>→</span></button><div class="saved" data-note-status></div></section>`;
 if(state.screen==='review')html=`<section class="page"><button class="back" data-action="notes">← Back to notes</button><span class="eyebrow">Nothing disappears between steps</span><h1>Does this look<br>like your plan?</h1><p class="description">${state.tasks.length} tasks, kept in your words. Edit anything before you continue.</p><div class="tasks">${taskRows(true)}</div><button class="primary" data-action="create">Create my plan <span>→</span></button></section>`;
 if(state.screen==='plan')html=`<section class="page"><div class="plan-header"><span class="plan-title">${state.fromNotes?'My first plan':'Weekend away'}</span><span class="badge badge-live">Your plan</span></div><span class="eyebrow">Start with one useful change</span><h1>A plan you can<br>make your own.</h1><p class="description">Edit a task or check something off. The next step is yours.</p><div class="tasks">${taskRows(true)}</div><div class="saved" data-save-status aria-live="polite">${state.edited?'Your change is in the plan.':''}</div><div class="end-actions"><span class="minimal">${state.tasks.length} tasks · ready when you are</span><button class="reset" data-action="reset">Try another starting point</button></div></section>`;
 if(state.screen==='invited')html=`<section class="page"><span class="eyebrow">You’re joining a plan, not starting over</span><h1>Your people already<br>have something going.</h1><div class="plan-header"><span class="plan-title">Weekend away</span><span class="badge badge-live">Shared plan</span></div><div class="people"><span class="avatar">A</span><span class="avatar">S</span>Alex and Sam are planning together</div><div class="tasks"><div class="task"><span class="task-text">Book our train tickets</span><span class="task-meta">Next step</span></div></div><div class="activity"><div class="activity-head"><span class="avatar">A</span>Alex</div><p>Shall we take the 10:20 train? Add an update when you’ve checked.</p></div>${state.updated?`<div class="activity"><div class="activity-head"><span class="avatar">Y</span>You · just now</div><p>${escape(state.update)}</p></div><div class="saved" aria-live="polite">Your update is part of the plan.</div>`:`<form class="update-form" data-update-form><label class="field-label" for="update">Your first contribution</label><input id="update" class="update-input" data-update placeholder="The 10:20 works for me." required><button class="primary" type="submit">Add my update <span>↑</span></button></form>`}</section>`;
 view.innerHTML=html;document.querySelector('[data-header-detail]').textContent=state.screen==='invited'?'A plan to join':state.adopted?'Your first plan':'Your next useful step';
}
function go(screen){state.screen=screen;render()}
function setEntry(entry){state.entry=entry;state.screen=config.version==='baseline'?'setup':entry==='invitee'&&config.version==='revised'?'invited':'start';render()}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(action==='example'){state.tasks=[...sample];state.checked=[];go('example')}else if(action==='adopt'){state.adopted=true;state.fromNotes=false;state.edited=false;go('plan')}else if(action==='review'){const value=document.querySelector('[data-notes]').value.trim();state.notes=value;if(!value){document.querySelector('[data-note-status]').textContent='Add at least one thing you want to do.';return}state.tasks=value.split(/\n+/).map(s=>s.replace(/^\s*(?:[-*•]|\d+[.)])\s*/,'').trim()).filter(Boolean).slice(0,6);state.checked=[];go('review')}else if(action==='create'){state.adopted=true;state.fromNotes=true;state.edited=false;go('plan')}else if(action==='reset'){state.adopted=false;state.edited=false;state.updated=false;state.update='';setEntry(state.entry)}else go(action)});
document.addEventListener('input',event=>{if(event.target.hasAttribute('data-task-edit')){state.tasks[Number(event.target.dataset.taskEdit)]=event.target.value;state.edited=true;const status=document.querySelector('[data-save-status]');if(status)status.textContent='Your change is in the plan.'}if(event.target.hasAttribute('data-notes'))state.notes=event.target.value});
document.addEventListener('change',event=>{if(event.target.hasAttribute('data-task-check')){state.checked[Number(event.target.dataset.taskCheck)]=event.target.checked;event.target.closest('.task').classList.toggle('task-done',event.target.checked);state.edited=true;const status=document.querySelector('[data-save-status]');if(status)status.textContent='Your change is in the plan.'}});
document.addEventListener('submit',event=>{if(!event.target.hasAttribute('data-update-form'))return;event.preventDefault();state.update=document.querySelector('[data-update]').value.trim();if(state.update){state.updated=true;render()}});
window.__planningApp={getState:()=>JSON.parse(JSON.stringify(state)),getConfig:()=>({...config}),go,setEntry,setNotes:text=>{state.notes=text;go('notes')},reset:()=>{state.adopted=false;state.edited=false;state.updated=false;state.tasks=[...sample];setEntry(config.entry)}};
setEntry(config.entry);
</script></body></html>
