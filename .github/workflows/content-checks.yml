name: Content service checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm --prefix services/content-api ci
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run
        working-directory: services/content-api
